[workspace]
members = ["crates/apiqa-core", "apps/desktop/src-tauri", "apps/cli"]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Prayag"]

[workspace.dependencies]
anyhow = "1.0.100"
blake3 = "1.8.2"
bytes = "1.11.1"
dashmap = "6.1.0"
hudsucker = { version = "0.25.0", features = ["http2"] }
http-body = "1.0.2"
http-body-util = "0.1.3"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "multipart", "query", "rustls", "stream"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
regex = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
similar = "3.1.1"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.49.0", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
url = "2.5.8"

[profile.release]
# Thin LTO + single codegen unit shrink the binary and improve runtime
# performance at the cost of longer release builds.
lto = "thin"
codegen-units = 1
strip = true

# Strict, uniform lint policy across the workspace. Unsafe code, dead code,
# and debug scaffolding are compile errors; the per-crate `cfg_attr` denies
# below additionally forbid unwrap/expect/panic in production (non-test) code
# so runtime panics are confined to bugs that cannot be expressed statically.
[workspace.lints.rust]
unsafe_code = "deny"
unused = "deny"
dead_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
