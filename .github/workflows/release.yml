name: Release Windows and Linux

on:
  workflow_dispatch:
    inputs:
      companion_apk_url:
        description: Direct URL to the locally built companion APK release asset.
        required: true
        type: string

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: --bundles nsis
            assetNamePattern: App_Tester_[version]_Windows.[ext]
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles appimage,deb
            assetNamePattern: App_Tester_[version]_Linux.[ext]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Download locally built companion APK
        shell: bash
        run: |
          mkdir -p apps/companion/releases
          curl --fail --location --retry 3 "${{ inputs.companion_apk_url }}" --output apps/companion/releases/app-tester-companion.apk
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: App Tester v__VERSION__
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          retryAttempts: 2
          releaseAssetNamePattern: ${{ matrix.assetNamePattern }}
