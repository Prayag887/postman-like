name: Production QA

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: production-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-qa:
    name: Production QA
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Stub the companion APK resource (built locally, uploaded at release)
        run: mkdir -p apps/companion/releases && touch apps/companion/releases/app-tester-companion.apk
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa:production
